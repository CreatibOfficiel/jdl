services:
  jeu-soiree-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: jeu-soiree-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=2567
      - DB_PATH=/app/apps/server/data/jeu-soiree.db
    volumes:
      - jeu-soiree-data:/app/apps/server/data
    networks:
      - proxy_net

  jeu-soiree-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: jeu-soiree-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - COLYSEUS_HTTP_URL=http://jeu-soiree-server:2567
      - HOSTNAME=0.0.0.0
      - PORT=3000
    networks:
      - proxy_net
    depends_on:
      jeu-soiree-server:
        condition: service_started

volumes:
  jeu-soiree-data:
    name: jeu-soiree-data

networks:
  proxy_net:
    external: true
